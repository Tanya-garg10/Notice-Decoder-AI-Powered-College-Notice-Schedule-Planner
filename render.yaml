services:
  - type: web
    name: notice-decoder
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FEATHERLESS_MODEL
        value: meta-llama/Meta-Llama-3.1-8B-Instruct
      - key: FEATHERLESS_API_KEY
        sync: false
